<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produk Kami</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #444;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: scale(1.02);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #333;
    }

    .product-info p {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      color: #007BFF;
    }

    .buy-button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .buy-button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1>Toko Seeyzz</h1>
  </header>

  <div class="container">
    <h2>Produk Unggulan</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Produk+1" alt="Produk 1" />
        <div class="product-info">
          <h3>Kaos Premium</h3>
          <p>Kaos katun nyaman untuk aktivitas harian.</p>
          <span class="price">Rp120.000</span><br />
          <a href="#" class="buy-button">Beli Sekarang</a>
        </div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Produk+2" alt="Produk 2" />
        <div class="product-info">
          <h3>Jam Tangan Elegan</h3>
          <p>Desain klasik dengan tali kulit asli.</p>
          <span class="price">Rp450.000</span><br />
          <a href="#" class="buy-button">Beli Sekarang</a>
        </div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200?text=Produk+3" alt="Produk 3" />
        <div class="product-info">
          <h3>Tas Ransel Stylish</h3>
          <p>Cocok untuk kerja dan kuliah, tahan air.</p>
          <span class="price">Rp280.000</span><br />
          <a href="#" class="buy-button">Beli Sekarang</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
